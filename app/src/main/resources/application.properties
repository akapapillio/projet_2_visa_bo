spring.application.name=VISA

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/visa_db
spring.datasource.username=vats
spring.datasource.password=0528

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactiver les caches Thymeleaf en dev
spring.thymeleaf.cache=false

# Flyway - désactivé car ddl-auto=update gère le schéma
spring.flyway.enabled=false

# Configuration multipart (upload de fichiers)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Configuration stockage fichiers
file.storage.upload-dir=./uploads
file.storage.max-file-size=5242880
